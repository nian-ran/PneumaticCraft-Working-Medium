modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Working Medium"
description = '''
A PneumaticCraft chemical-plant addon. Towers, kettles, columns, galleries and rooms run on pressure, flow, temperature and a working medium. Each grade changes that medium, and the last grade holds supercritical carbon dioxide inside its window.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "pneumaticcraft"
type = "required"
versionRange = "[8.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "NONE"
side = "CLIENT"
reason = "Shows pressure/temperature windows and multiblock structure previews."
